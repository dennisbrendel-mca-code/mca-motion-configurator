<title>MCA Motion configurator</title>
<style>
  :root { --blue: #0C2C65; --pink: #BE0068; --grey: #9FA0D0; --off: #F4F6F8; --body: #1A1A1A; --white: #FFFFFF; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Trebuchet MS", sans-serif; background: var(--off); color: var(--body); }
  header { background: var(--blue); color: var(--white); padding: 18px 24px; }
  header h1 { margin: 0; font-size: 22px; font-weight: normal; }
  main { max-width: 420px; margin: 60px auto; padding: 0 16px; }
  .card { background: var(--white); border: 1px solid var(--grey); border-top: 6px solid var(--pink); padding: 24px; }
  h2 { margin: 0 0 6px; color: var(--pink); font-weight: normal; }
  label { display: block; color: var(--blue); font-weight: bold; margin: 16px 0 6px; }
  input { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--grey); }
  button { margin-top: 16px; width: 100%; font: inherit; padding: 11px; border: 0; background: var(--pink); color: var(--white); cursor: pointer; }
  button:disabled { background: var(--grey); cursor: wait; }
  #fout { color: var(--pink); min-height: 1.4em; margin-top: 10px; font-size: 14px; }
  label.klein { font-weight: normal; color: var(--body); display: flex; gap: 8px; align-items: center; font-size: 14px; }
  label.klein input { width: auto; }
</style>
</head>

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function ontsleutel(w) {
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(w), 'PBKDF2', false, ['deriveKey']);
  const sleutel = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const uit = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, sleutel, bytes(DATA));
  return new TextDecoder().decode(uit);
}
async function open(w, stil) {
  const knop = document.getElementById('k'), fout = document.getElementById('fout');
  knop.disabled = true; knop.textContent = 'Bezig met openen';
  try {
    const html = await ontsleutel(w);
    try { if (document.getElementById('onthoud') && document.getElementById('onthoud').checked) sessionStorage.setItem('mcaCfgW', w); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem('mcaCfgW'); } catch (x) {}
    knop.disabled = false; knop.textContent = 'Openen';
    if (!stil) fout.textContent = 'Onjuist wachtwoord. Probeer het opnieuw.';
  }
}
if (!(window.crypto && crypto.subtle)) {
  document.getElementById('k').disabled = true;
  document.getElementById('fout').textContent = 'Deze pagina kan hier niet ontsleuteld worden. Open hem via de https link die je van MCA hebt gekregen.';
}
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); open(document.getElementById('w').value); });
try { const w = sessionStorage.getItem('mcaCfgW'); if (w) open(w, true); } catch (e) {}
